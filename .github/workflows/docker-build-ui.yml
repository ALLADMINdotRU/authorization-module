# ═══════════════════════════════════════════════════════════════
# .github/workflows/docker-build-ui.yml
# Сборка и пуш образа ФРОНТЕНДА в Docker Hub
# ═══════════════════════════════════════════════════════════════

# name — название workflow (видно на вкладке Actions в GitHub)
name: Build and Push UI Docker Image

# ── Триггер: когда запускать ──
on:
  push:                       # при пуше (git push) в репозиторий
    branches:
      - main                  #   только в ветку main
    paths:
      - 'authorization-module-ui/**'   #   и только если изменились файлы фронтенда
                                        #   (** = все файлы и подпапки внутри)
  workflow_dispatch:     # ← позволяет запускать вручную

# ── Задачи (jobs) ──
jobs:
  build:                      # имя задачи (может быть любым)
    runs-on: ubuntu-latest    # на какой машине выполнять (виртуалка GitHub с Docker)

    # ── Шаги (steps) — выполняются по порядку ──
    steps:

      # Шаг 1: скачать исходники репозитория на машину раннера
      # (actions/checkout — готовый action, делает "git clone")
      - name: Checkout
        uses: actions/checkout@v4

      # Шаг 2: войти в Docker Hub (логин+пароль из Secrets)
      # (docker/login-action — готовый action для авторизации)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}   # логин Docker Hub (секрет)
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}   # пароль/токен (секрет)

      # Шаг 3: собрать образ и запушить одним действием
      # (docker/build-push-action — сборка + пуш)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: authorization-module-ui   # папка, где Dockerfile фронтенда
          push: true                         # запушить после сборки (true = да)
          tags: |                            # список тегов образа
            fil232323/auth-module-ui:latest            
            fil232323/auth-module-ui:${{ github.sha }} 
