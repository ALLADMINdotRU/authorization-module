# ═══════════════════════════════════════════════════════════════
# Сборка и пуш Docker-образа в Docker Hub (GitHub Actions)
# ═══════════════════════════════════════════════════════════════

name: Build and Push Docker Image

# ── Триггер: запускать при пуше в ветку main ──
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest        # раннер GitHub (виртуальная машина с Docker)

    steps:
      # 1. Скачать исходники репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Авторизоваться в Docker Hub (логин+пароль из Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # 3. Собрать образ и запушить (одним действием)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: authorization-module-app                    # собирать из корня (там Dockerfile)
          push: true                    # запушить после сборки
          tags: |
            fil232323/auth-module-app:latest
            fil232323/auth-module-app:${{ github.sha }}