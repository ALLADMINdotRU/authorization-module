server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA: отдаём index.html для всех клиентских маршрутов (React Router) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API: проксируем всё, что начинается с /auth/, на бэкенд ──
    # proxy_pass БЕЗ слэша на конце → сохраняем исходный URI (/auth/login → /auth/login)
    location /auth/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Опционально: проброс служебных эндпоинтов бэка ──
    location = /health {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
}
